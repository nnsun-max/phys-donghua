<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>旋转矢量法：横屏全幅 | 顺时针初相位</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e8f0 100%);
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Noto Sans', system-ui, sans-serif;
        }
        /* 卡片容器：横屏时贴边，充分利用空间 */
        .card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(2px);
            border-radius: 1.2rem;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.2);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }
        /* 画布容器：弹性放大，占满剩余空间 */
        .canvas-container {
            background: #ffffff;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            display: block;
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            background: #fff;
        }
        /* 控制栏：紧凑可滚动 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 0.8rem;
            background: rgba(248,250,253,0.9);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(140,170,200,0.3);
            flex-shrink: 0;
        }
        .ctrl-group {
            background: #ffffffcc;
            padding: 0.25rem 0.6rem;
            border-radius: 2rem;
            box-shadow: inset 0 1px 1px #fff8, 0 1px 2px #0001;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1 1 auto;
            min-width: 130px;
            backdrop-filter: blur(2px);
        }
        .ctrl-group label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #1e2f3e;
        }
        input[type="range"] {
            width: 110px;
            height: 4px;
            -webkit-appearance: none;
            background: #cbdbe0;
            border-radius: 4px;
            flex-shrink: 1;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2c5f8a;
            cursor: pointer;
            box-shadow: 0 1px 3px #0002;
            border: none;
        }
        .value-display {
            background: #eef2f7;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            min-width: 48px;
            text-align: center;
            font-weight: 500;
        }
        /* 横屏专用优化：占满全屏，无留白 */
        @media (orientation: landscape) {
            body {
                padding: 0;
            }
            .card {
                border-radius: 0;
                box-shadow: none;
            }
            .controls {
                padding: 0.4rem 0.6rem;
                gap: 0.4rem;
            }
            .ctrl-group {
                padding: 0.2rem 0.5rem;
                gap: 0.4rem;
                min-width: 120px;
            }
            .ctrl-group label {
                font-size: 0.75rem;
            }
            input[type="range"] {
                width: 100px;
            }
            .value-display {
                font-size: 0.7rem;
                min-width: 44px;
            }
        }
        /* 竖屏时保留一定边距，画布宽度自适应 */
        @media (orientation: portrait) {
            body {
                padding: 8px;
            }
            .card {
                border-radius: 1.2rem;
                height: auto;
                max-height: 95vh;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="canvas-container">
        <canvas id="mainCanvas" width="1100" height="520" style="width:auto; height:100%; max-width:100%;"></canvas>
    </div>
    <div class="controls">
        <div class="ctrl-group">
            <span>🎚️ 振幅 A</span>
            <input type="range" id="ampSlider" min="0.3" max="4.0" step="0.02" value="2.0">
            <span id="ampVal" class="value-display">2.00</span>
        </div>
        <div class="ctrl-group">
            <span>⚡ 角频率 ω</span>
            <input type="range" id="freqSlider" min="0.6" max="3.2" step="0.02" value="1.8">
            <span id="freqVal" class="value-display">1.80</span>
        </div>
        <div class="ctrl-group">
            <span>🎛️ 初相位 φ₀</span>
            <input type="range" id="phaseSlider" min="0" max="360" step="1" value="45">
            <span id="phaseVal" class="value-display">45°</span>
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        // 固定逻辑尺寸 1100x520，缩放由CSS处理，保证坐标精确
        const width = 1100;
        const height = 520;
        canvas.width = width;
        canvas.height = height;

        // 坐标布局
        const leftCenterX = 250;
        const leftCenterY = height / 2;          // 位移零点水平线 (x=0)
        
        // 右侧波形区域（完全固定不动）
        const tAxisY = leftCenterY;
        const FIXED_MAX_DISP = 4.2;
        const verticalAxisTopY = tAxisY - 130;
        const verticalAxisBottomY = tAxisY + 130;
        const tDisplayMin = -3.0;
        const tDisplayMax = 3.0;
        const rightCurveMinX = 530;
        const rightCurveMaxX = width - 70;
        
        // 振幅映射到左侧半径
        function ampToRadius(amp) {
            const minR = 30, maxR = 135;
            const minA = 0.3, maxA = 4.0;
            return minR + (amp - minA) / (maxA - minA) * (maxR - minR);
        }
        
        function degToRad(deg) { return deg * Math.PI / 180; }
        
        // 物理参数
        let amplitude = 2.0;
        let angularFreq = 1.8;
        let initialPhaseDeg = 45;
        let initialPhaseRad = degToRad(45);
        
        // 顺时针角度
        let currentAngleRad = -initialPhaseRad;
        let currentX = 0;
        
        let fixedOriginX = 0;
        
        const ampSlider = document.getElementById('ampSlider');
        const ampVal = document.getElementById('ampVal');
        const freqSlider = document.getElementById('freqSlider');
        const freqVal = document.getElementById('freqVal');
        const phaseSlider = document.getElementById('phaseSlider');
        const phaseVal = document.getElementById('phaseVal');
        
        function updateSlidersDisplay() {
            ampVal.innerText = amplitude.toFixed(2);
            freqVal.innerText = angularFreq.toFixed(2);
            phaseVal.innerText = initialPhaseDeg + "°";
        }
        
        function updateState() {
            amplitude = parseFloat(ampSlider.value);
            angularFreq = parseFloat(freqSlider.value);
            initialPhaseDeg = parseFloat(phaseSlider.value);
            initialPhaseRad = degToRad(initialPhaseDeg);
            currentAngleRad = -initialPhaseRad;
            currentX = amplitude * Math.cos(initialPhaseRad);
            updateSlidersDisplay();
            drawCanvas();
        }
        
        ampSlider.addEventListener('input', updateState);
        freqSlider.addEventListener('input', updateState);
        phaseSlider.addEventListener('input', updateState);
        
        function mapXtoY(xVal) {
            let t = (xVal + FIXED_MAX_DISP) / (2 * FIXED_MAX_DISP);
            t = Math.min(1, Math.max(0, t));
            return verticalAxisBottomY - t * (verticalAxisBottomY - verticalAxisTopY);
        }
        
        function mapTtoX(t) {
            const ratio = (t - tDisplayMin) / (tDisplayMax - tDisplayMin);
            return rightCurveMinX + ratio * (rightCurveMaxX - rightCurveMinX);
        }
        
        function shm(t) {
            return amplitude * Math.cos(angularFreq * t + initialPhaseRad);
        }
        
        function drawArrow(ctx, fromX, fromY, toX, toY, color, width) {
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            let angle = Math.atan2(toY - fromY, toX - fromX);
            let arrowSize = 13;
            let ax1 = toX - arrowSize * 0.5 * Math.cos(angle - Math.PI/6);
            let ay1 = toY - arrowSize * 0.5 * Math.sin(angle - Math.PI/6);
            let ax2 = toX - arrowSize * 0.5 * Math.cos(angle + Math.PI/6);
            let ay2 = toY - arrowSize * 0.5 * Math.sin(angle + Math.PI/6);
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(ax1, ay1);
            ctx.lineTo(ax2, ay2);
            ctx.fillStyle = color;
            ctx.fill();
        }
        
        function drawAngleArc(ctx, cx, cy, radius, startAngle, endAngle, color, lineWidth) {
            let sweep = endAngle - startAngle;
            if (Math.abs(sweep) < 0.01) return;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, startAngle, endAngle, sweep < 0);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.setLineDash([]);
            ctx.stroke();
            
            const midAngle = startAngle + sweep / 2;
            const labelRadius = radius + 15;
            const labelX = cx + labelRadius * Math.cos(midAngle);
            const labelY = cy + labelRadius * Math.sin(midAngle);
            const angleAbs = Math.abs(sweep) * 180 / Math.PI;
            ctx.fillStyle = "#b45309";
            ctx.font = "bold 15px 'Segoe UI'";
            ctx.fillText(`${angleAbs.toFixed(0)}°`, labelX-12, labelY-6);
        }
        
        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // ========= 左侧圆周运动 =========
            const radiusPx = ampToRadius(amplitude);
            
            // 纵轴 x
            ctx.beginPath();
            ctx.moveTo(leftCenterX, 40);
            ctx.lineTo(leftCenterX, height-40);
            ctx.strokeStyle = "#5a7c94";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = "#2d5f7e";
            ctx.beginPath();
            ctx.moveTo(leftCenterX-5, 48);
            ctx.lineTo(leftCenterX, 35);
            ctx.lineTo(leftCenterX+5, 48);
            ctx.fill();
            ctx.fillStyle = "#1e4663";
            ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText("x", leftCenterX-15, 52);
            
            // 参考横线
            ctx.beginPath();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#b8cde0";
            ctx.setLineDash([6, 8]);
            ctx.moveTo(40, leftCenterY);
            ctx.lineTo(480, leftCenterY);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#8aa0b0";
            ctx.font = "italic 13px";
            ctx.fillText("(参考线)", leftCenterX+radiusPx+5, leftCenterY-8);
            
            // 圆周
            ctx.beginPath();
            ctx.arc(leftCenterX, leftCenterY, radiusPx, 0, 2*Math.PI);
            ctx.strokeStyle = "#3f7e9c";
            ctx.lineWidth = 2.2;
            ctx.stroke();
            ctx.fillStyle = "#eef3fc30";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(leftCenterX, leftCenterY, 5, 0, 2*Math.PI);
            ctx.fillStyle = "#1e4663";
            ctx.fill();
            ctx.fillStyle = "#2c5f8a";
            ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText("O", leftCenterX-14, leftCenterY-8);
            
            // 质点 B
            let sinPhi = Math.sin(currentAngleRad);
            let cosPhi = Math.cos(currentAngleRad);
            let particleX = leftCenterX + radiusPx * sinPhi;
            let particleY = leftCenterY - radiusPx * cosPhi;
            let displacement = amplitude * Math.cos(initialPhaseRad);
            
            drawArrow(ctx, leftCenterX, leftCenterY, particleX, particleY, "#c7452b", 3.5);
            ctx.beginPath();
            ctx.arc(particleX, particleY, 9, 0, 2*Math.PI);
            ctx.fillStyle = "#e2583e";
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(particleX, particleY, 3.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "#1d4e5f";
            ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText("B", particleX+8, particleY-8);
            
            // 射线: x正向 和 OB
            ctx.beginPath();
            ctx.moveTo(leftCenterX, leftCenterY);
            ctx.lineTo(leftCenterX, leftCenterY - radiusPx - 20);
            ctx.strokeStyle = "#2c5f8a";
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(leftCenterX, leftCenterY);
            ctx.lineTo(particleX, particleY);
            ctx.strokeStyle = "#c7452b";
            ctx.lineWidth = 1.8;
            ctx.stroke();
            
            // 夹角圆弧
            const startAngRay = -Math.PI / 2;
            const endAngRay = startAngRay + currentAngleRad;
            const arcRadius = radiusPx * 0.65;
            drawAngleArc(ctx, leftCenterX, leftCenterY, arcRadius, startAngRay, endAngRay, "#d97706", 2.5);
            
            ctx.fillStyle = "#1d4e5f";
            ctx.font = "bold 16px monospace";
            ctx.fillText(`x = ${displacement.toFixed(3)}`, leftCenterX-95, leftCenterY-22);
            
            // ========= 右侧固定波形区域 =========
            ctx.beginPath();
            ctx.strokeStyle = "#5a7c94";
            ctx.lineWidth = 2;
            ctx.moveTo(rightCurveMinX, tAxisY);
            ctx.lineTo(rightCurveMaxX, tAxisY);
            ctx.stroke();
            ctx.fillStyle = "#2d5f7e";
            ctx.beginPath();
            ctx.moveTo(rightCurveMaxX-12, tAxisY-5);
            ctx.lineTo(rightCurveMaxX, tAxisY);
            ctx.lineTo(rightCurveMaxX-12, tAxisY+5);
            ctx.fill();
            ctx.fillStyle = "#2d5f7e";
            ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText("t", rightCurveMaxX-18, tAxisY-10);
            
            fixedOriginX = mapTtoX(0);
            ctx.beginPath();
            ctx.arc(fixedOriginX, tAxisY, 6, 0, 2*Math.PI);
            ctx.fillStyle = "#e08541";
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(fixedOriginX, tAxisY, 3, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "#a04e2c";
            ctx.font = "bold 14px 'Segoe UI'";
            ctx.fillText("O (原点)", fixedOriginX+10, tAxisY-7);
            
            ctx.beginPath();
            ctx.strokeStyle = "#2266aa";
            ctx.lineWidth = 2.8;
            ctx.setLineDash([]);
            const steps = 250;
            let first = true;
            for (let i = 0; i <= steps; i++) {
                const t = tDisplayMin + (i / steps) * (tDisplayMax - tDisplayMin);
                const x = shm(t);
                const canvasX = mapTtoX(t);
                const canvasY = mapXtoY(x);
                if (canvasX < rightCurveMinX || canvasX > rightCurveMaxX) continue;
                if (canvasY < verticalAxisTopY-10 || canvasY > verticalAxisBottomY+10) {
                    first = true;
                    continue;
                }
                if (first) {
                    ctx.moveTo(canvasX, canvasY);
                    first = false;
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();
            
            // 曲线上 t=0 的点
            const curvePointX = mapTtoX(0);
            const curvePointY = mapXtoY(shm(0));
            ctx.beginPath();
            ctx.arc(curvePointX, curvePointY, 7, 0, 2*Math.PI);
            ctx.fillStyle = "#f0b27a";
            ctx.fill();
            
            // ========= 右侧振子：固定于原点 O 水平位置 =========
            const vibratorX = fixedOriginX;
            const vibratorY = particleY;
            
            ctx.beginPath();
            ctx.strokeStyle = "#5a7c94";
            ctx.lineWidth = 2;
            ctx.moveTo(vibratorX, verticalAxisTopY - 12);
            ctx.lineTo(vibratorX, verticalAxisBottomY + 12);
            ctx.stroke();
            ctx.fillStyle = "#2d5f7e";
            ctx.beginPath();
            ctx.moveTo(vibratorX-5, verticalAxisTopY-12);
            ctx.lineTo(vibratorX, verticalAxisTopY-18);
            ctx.lineTo(vibratorX+5, verticalAxisTopY-12);
            ctx.fill();
            ctx.fillStyle = "#2d5f7e";
            ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText("x", vibratorX+10, verticalAxisTopY-15);
            
            ctx.beginPath();
            ctx.arc(vibratorX, vibratorY, 13, 0, 2*Math.PI);
            ctx.fillStyle = "#4c9f70";
            ctx.shadowBlur = 5;
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(vibratorX, vibratorY, 5, 0, 2*Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#226653";
            ctx.font = "bold 14px 'Segoe UI'";
            ctx.fillText("振子", vibratorX+15, vibratorY-12);
            
            ctx.beginPath();
            ctx.arc(vibratorX, vibratorY, 17, 0, 2*Math.PI);
            ctx.fillStyle = "#90ee9080";
            ctx.fill();
            
            // 连线
            ctx.beginPath();
            ctx.moveTo(particleX, particleY);
            ctx.lineTo(vibratorX, vibratorY);
            ctx.strokeStyle = "#90a0b0";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 参数显示
            ctx.font = "bold 15px monospace";
            ctx.fillStyle = "#416d85";
            ctx.fillText(`A = ${amplitude.toFixed(2)}   ω = ${angularFreq.toFixed(2)} rad/s`, rightCurveMinX+25, verticalAxisBottomY+25);
        }
        
        function init() {
            updateState();
            // 监听屏幕旋转或尺寸变化，重新绘制（保证画布比例不错位）
            window.addEventListener('resize', () => drawCanvas());
        }
        
        init();
    })();
</script>
</body>
</html>
